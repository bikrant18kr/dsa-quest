<html lang="en">

<title>DSA Quest — Cloud</title>
<style>
:root{--bg:#070b14;--panel:#0e1626;--panel2:#121d31;--line:#263653;--text:#f6f8ff;--muted:#91a2bd;--purple:#8b5cf6;--cyan:#22d3ee;--green:#34d399;--red:#fb7185;--yellow:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 15% -10%,#2c3470,transparent 60%),radial-gradient(700px 500px at 100% 15%,#103b50,transparent 55%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(480px,100%);background:#0e1626ee;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 25px 80px #0008}.brand{font-size:25px;font-weight:950;margin-bottom:6px}.brand .logo{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--cyan));margin-right:10px}.login-card h1{font-size:30px;margin:20px 0 5px}.login-card p{color:var(--muted)}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.input,.select,.area{width:100%;border:1px solid var(--line);background:#091221;color:white;border-radius:11px;padding:11px}.area{min-height:90px;resize:vertical}.btn{border:1px solid var(--line);background:var(--panel);color:#fff;padding:10px 14px;border-radius:11px;cursor:pointer}.btn:hover{border-color:#5d77a5}.primary{background:linear-gradient(135deg,var(--purple),#5d4ae6);border:0}.danger{background:#431d28}.success{background:#0d3c30}.app{display:flex;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:#060a13ee;border-right:1px solid var(--line);padding:18px 12px;z-index:10}.side-brand{font-size:20px;font-weight:950;padding:7px 10px 24px}.nav button{display:block;width:100%;border:0;background:none;color:#aab8cf;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#172440;color:white}.nav span{margin-left:8px}.side-user{position:absolute;left:14px;right:14px;bottom:16px;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:11px}.main{margin-left:245px;width:calc(100% - 245px);max-width:1550px;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{margin:0;font-size:29px}.top p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(5,1fr);margin-top:20px}.two{grid-template-columns:1.45fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.card{background:#0e1626ee;border:1px solid var(--line);border-radius:17px;padding:16px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.big{font-size:29px;font-weight:950}.muted{color:var(--muted)}.progress{height:8px;background:#202c45;border-radius:999px;overflow:hidden}.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:.3s}.section{margin-top:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;font-size:18px}.q{display:flex;align-items:center;gap:10px;padding:11px;border-bottom:1px solid var(--line)}.q:last-child{border:0}.check{width:32px;height:32px;padding:0;border-radius:9px;border:1px solid var(--line);background:#101a2d;color:#7285a4;cursor:pointer}.check.done{background:#0d4b39;color:#7cf2c5;border-color:#28775e}.qm{flex:1;min-width:0}.qn{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.badge{font-size:10px;padding:3px 7px;border-radius:999px;background:#202d47;color:#cbd6e7}.p1{background:#4b202b;color:#fecdd3}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin:17px 0}.pattern{cursor:pointer;transition:.15s}.pattern:hover{transform:translateY(-2px);border-color:#5c77a5}.pattern h3{margin:0 0 5px}.pattern p{color:var(--muted)}.timer{text-align:center}.clock{font-size:72px;font-weight:950;letter-spacing:.04em}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.cell{height:22px;border-radius:5px;background:#19243b}.c2{background:#1c604a}.c3{background:#278b69}.c4{background:#39b98d}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;text-align:left;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--muted)}.empty{text-align:center;padding:42px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:18px;z-index:30}.modal.show{display:grid}.modal-box{max-width:780px;width:100%;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.close{float:right;border:0;background:none;color:#9badc8;font-size:26px;cursor:pointer}.toast{display:none;position:fixed;right:20px;bottom:20px;background:#17243b;border:1px solid #40557c;padding:11px 15px;border-radius:12px;z-index:40}.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:6px}.sync-dot.ok{background:var(--green)}.sync-dot.err{background:var(--red)}

<body>
<section id="login">
  <div class="login-card">
    <div class="brand"><span class="logo">Q</span> DSA Quest Cloud</div>
    <p>One account. Same DSA progress on phone, laptop and tablet.</p>
    <div id="connectionStatus" class="card" style="margin:14px 0;padding:12px">
      <span class="sync-dot"></span> Connecting securely…
    </div>
    <div id="authArea"></div>
    <p style="font-size:12px;margin-top:18px">Cloud connection is configured for this DSA Quest app. You only need your own account.</p>
  </div>
</section>

<div id="app" class="app hidden">
<aside class="sidebar">
  <div class="side-brand"><span class="logo">Q</span><span>DSA Quest</span></div>
  <nav class="nav">
    <button class="active" data-page="home">🏠 <span>Dashboard</span></button>
    <button data-page="today">🎯 <span>Today's Mission</span></button>
    <button data-page="bank">📚 <span>Master Bank</span></button>
    <button data-page="patterns">🧠 <span>Pattern Lab</span></button>
    <button data-page="focus">⏱️ <span>Focus Room</span></button>
    <button data-page="mistakes">⚡ <span>Mistake Lab</span></button>
    <button data-page="analytics">📈 <span>Analytics</span></button>
    <button data-page="oa">⚔️ <span>OA Simulation</span></button>
    <button data-page="review">🔁 <span>Smart Review</span></button>
    <button data-page="history">📅 <span>Day History</span></button>
    <button data-page="favorites">⭐ <span>Favorites</span></button>
    <button data-page="settings">⚙️ <span>Account & Sync</span></button>
  </nav>
  <div class="side-user"><b id="userName">OA Warrior</b><div class="muted"><span id="syncDot" class="sync-dot"></span><span id="syncText">Local</span></div></div>
</aside>
<main class="main">
  <div class="top">
    <div><h1 id="title">DSA Quest 🚀</h1><p id="subtitle">Make DSA revision addictive.</p></div>
    <div class="actions"><button class="btn" onclick="randomQ()">🎲 Random</button><button class="btn" onclick="exportProgress()">Export</button><button class="btn primary" onclick="go('today')">Start Mission</button></div>
  </div>
  <div id="root"></div>
</main>
</div>

<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

async function connect(){
  const el=document.querySelector('#connectionStatus');
  try{
    if(!window.supabase || typeof window.supabase.createClient!=='function'){
      throw new Error('Supabase library failed to load. Please refresh once.');
    }
    const SUPABASE_URL='https://ugkoajfmagcolupceqzd.supabase.co';
    const SUPABASE_KEY='sb_publishable_xySYFD7toHrOM7nhiFyEJg_Jf9TEtMI';
    const health=await fetch(SUPABASE_URL+'/auth/v1/settings',{headers:{apikey:SUPABASE_KEY}});
    if(!health.ok){
      const msg=await health.text();
      throw new Error('Supabase API check failed ('+health.status+'): '+msg);
    }
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}
    });
    const {data,error}=await db.auth.getSession();
    if(error) throw error;
    if(data.session){user=data.session.user;await cloudLoad();enterApp();}

    console.error('DSA Quest connection error:',e);
  }
}

async function signup(){
  const email=$('#authEmail').value.trim(),password=$('#authPass').value;
  if(!email||password.length<6){toast('Enter a valid email and a 6+ character password');return}
  try{
    const {data,error}=await db.auth.signUp({email,password});
    if(error){toast(error.message);return}
    if(data.session){user=data.user;await cloudLoad();enterApp();return}
    toast('Account created. Check your email to confirm, then sign in.');
  }catch(e){toast(e.message)}
}
async function signin(){
  const email=$('#authEmail').value.trim(),password=$('#authPass').value;
  if(!email||!password){toast('Enter email and password');return}
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});

    user=data.user;await cloudLoad();enterApp();

async function cloudLoad(){
  if(!db||!user)return;
  syncState('Loading…');
  const {data,error}=await db.from('dsa_progress').select('payload').eq('user_id',user.id).maybeSingle();
  if(error){syncState('Sync error','err');throw error}
  if(data?.payload){S=Object.assign(S,data.payload);localSave();}
  syncState('Synced','ok');
}

async function cloudSave(){
  localSave();
  if(mode!=='cloud'||!db||!user)return;
  clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{
    syncState('Saving…');
    const {error}=await db.from('dsa_progress').upsert({user_id:user.id,payload:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});

function qcard(x){
  const v=status(x.id),fav=isFavorite(x.id);
  return `<div class=q><button class=check ${v==='Solved'?'done':''} onclick="setStatus('${x.id}','${v==='Solved'?'Not Started':'Solved'}')">${v==='Solved'?'✓':'○'}</button>
  <div class=qm><div class=qn>${esc(x.title)}</div><div class=badges><span class=badge>${esc(x.topic)}</span><span class=badge>${esc(x.pattern)}</span><span class=badge>${esc(x.sources||x.source||'')}</span><span class="badge ${x.importance==='P1'?'p1':''}">${x.importance}</span></div></div>
  <button class=btn title="${fav?'Remove from Favorites':'Add to Favorites'}" onclick="toggleFavorite('${x.id}')">${fav?'⭐':'☆'}</button>
  <button class=btn onclick="openProblem('${x.id}')">Open</button></div>`;
}

function home(){
  const solved=DATA.master.filter(x=>status(x.id)==='Solved').length,p=Math.round(solved/DATA.master.length*100),it=DATA.daily.filter(x=>x.day===dayNumber()),todaySolved=it.filter(x=>status(x.masterId)==='Solved').length,re=DATA.master.filter(x=>status(x.id)==='Revisit').slice(0,6);
  $('#root').innerHTML=`<div class="grid stats">
  <div class=card><div class=label>Solved</div><div class=big>${solved}</div><div class=muted>of ${DATA.master.length}</div></div>
  <div class=card><div class=label>Progress</div><div class=big>${p}%</div><div class=progress><div class=bar style="width:${p}%"></div></div></div>
  <div class=card><div class=label>Today's Run</div><div class=big>${todaySolved}/${it.length}</div><div class=muted>Day ${dayNumber()}</div></div>
  <div class=card><div class=label>XP</div><div class=big>${S.xp}</div><div class=muted>Level ${Math.floor(S.xp/500)+1}</div></div>
  <div class=card><div class=label>Days</div><div class=big>${Object.keys(S.days).length} 🔥</div><div class=muted>completed</div></div></div>
  <div class="grid two"><section class=section><div class=head><h2>🎯 Today's Mission</h2><button class=btn onclick="go('today')">Open</button></div><div class=card>${it.slice(0,7).map(x=>DATA.master.find(z=>z.id===x.masterId)).filter(Boolean).map(qcard).join('')}</div></section>
  <section class=section><div class=head><h2>🏆 Achievements</h2></div><div class=grid>${achievement('🌱','First Blood',solved>=1)}${achievement('🔥','10 Club',solved>=10)}${achievement('⚔️','50 Club',solved>=50)}${achievement('👑','100 Club',solved>=100)}</div></section></div>
  <section class=section><div class=head><h2>🗓️ Consistency</h2></div><div class=card><div class=heat>${heat()}</div></div></section>
  <section class=section><div class=head><h2>🔁 Revisit Queue</h2></div><div class=card>${re.length?re.map(qcard).join(''):'<div class=empty>Clean queue. Keep going 😎</div>'}</div></section>`;
}
function achievement(i,n,on){return `<div class=card><b>${i} ${n}</b><div class=muted>${on?'Unlocked ✅':'Locked 🔒'}</div></div>`}
function heat(){let s='';for(let i=83;i>=0;i--){const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10),n=S.history[d]||0;s+=`<div class="cell ${n>=5?'c4':n>=3?'c3':n>=1?'c2':''}" title="${d}: ${n} solved"></div>`}return s}
function today(){
  const it=DATA.daily.filter(x=>x.day===dayNumber()),done=it.filter(x=>status(x.masterId)==='Solved').length;
  $('#root').innerHTML=`<div class=card><div class=head><div><h2 style="margin:0">Day ${dayNumber()} Quest</h2><div class=muted>${done}/${it.length} completed</div></div><button class="btn primary" onclick=finishDay()>Finish Day 🏆</button></div><div class=progress><div class=bar style="width:${it.length?done/it.length*100:0}%"></div></div></div>
  ${['Concept Rebuild','Approach Recall','Timed Coding'].map(sec=>`<section class=section><div class=head><h2>${sec}</h2><span class=badge>${it.filter(x=>x.section===sec).length}</span></div><div class=card>${it.filter(x=>x.section===sec).map(x=>DATA.master.find(z=>z.id===x.masterId)).filter(Boolean).map(qcard).join('')}</div></section>`).join('')}`;
}
function finishDay(){const it=DATA.daily.filter(x=>x.day===dayNumber());if(it.some(x=>status(x.masterId)!=='Solved')){toast('Complete the mission first 💪');return}if(!S.days[dayNumber()]){S.days[dayNumber()]=new Date().toISOString();S.xp+=100;toast('🏆 Day complete! +100 XP')}save();render('today')}
function dayStats(day){
  const items=DATA.daily.filter(x=>x.day===day), solved=items.filter(x=>status(x.masterId)==='Solved').length;
  return {items,solved,total:items.length,done:items.length>0&&solved===items.length};
}
function history(){
  const totalDays=Math.ceil(DATA.daily.length/20), current=dayNumber();
  const cards=[];
  for(let d=1;d<=totalDays;d++){
    const st=dayStats(d), planned=DATA.daily.find(x=>x.day===d)?.date||'';
    const completed=!!S.days[d]||st.done;
    const pct=st.total?Math.round(st.solved/st.total*100):0;
    const state=d===current?'Today':completed?'Completed':d<current?'In Progress':'Upcoming';
    cards.push(`<div class=card><div class=head><div><h3 style="margin:0">Day ${d} ${d===current?'🎯':''}</h3><div class=muted>${esc(planned)} · ${st.solved}/${st.total} solved</div></div><span class="badge ${completed?'success':''}">${state}</span></div><div class=progress><div class=bar style="width:${pct}%"></div></div><div class=actions style="margin-top:10px"><button class=btn onclick="viewDay(${d})">Open Day</button></div></div>`);
  }
  $('#root').innerHTML=`<div class=card><div class=head><div><h2 style="margin:0">📅 Day History</h2><div class=muted>Nothing is deleted when the date changes. Reopen any day anytime.</div></div><span class=badge>${totalDays} days</span></div></div><div class=grid two style="margin-top:14px">${cards.join('')}</div>`;
}
function viewDay(day){
  const it=DATA.daily.filter(x=>x.day===day),done=it.filter(x=>status(x.masterId)==='Solved').length;
  $('#title').textContent=`Day ${day} Mission 📅`;$('#subtitle').textContent=`${done}/${it.length} completed · Previous days remain available`;
  $('#root').innerHTML=`<div class=card><div class=head><div><h2 style="margin:0">Day ${day}</h2><div class=muted>${esc(it[0]?.date||'')} · ${done}/${it.length} solved</div></div><button class=btn onclick="go('history')">← All Days</button></div><div class=progress><div class=bar style="width:${it.length?done/it.length*100:0}%"></div></div></div>${['Concept Rebuild','Approach Recall','Timed Coding'].map(sec=>`<section class=section><div class=head><h2>${sec}</h2><span class=badge>${it.filter(x=>x.section===sec).length}</span></div><div class=card>${it.filter(x=>x.section===sec).map(x=>DATA.master.find(z=>z.id===x.masterId)).filter(Boolean).map(qcard).join('')}</div></section>`).join('')}`;
}
function favorites(){
  const a=S.favorites.map(id=>DATA.master.find(x=>x.id===id)).filter(Boolean);
  $('#root').innerHTML=`<div class=card><div class=head><div><h2 style="margin:0">⭐ Favorites</h2><div class=muted>${a.length} saved for revision.</div></div><span class=badge>Cloud synced</span></div><div class=actions><button class=btn onclick="favoriteFilter('all')">All</button><button class=btn onclick="favoriteFilter('unsolved')">Unsolved</button><button class=btn onclick="favoriteFilter('failed')">Failed</button><button class=btn onclick="favoriteFilter('revisit')">Revisit</button></div><div id=favList style="margin-top:12px"></div></div>`;
  favoriteFilter('all');
}
function favoriteFilter(kind){
  const a=S.favorites.map(id=>DATA.master.find(x=>x.id===id)).filter(Boolean).filter(x=>kind==='all'||(kind==='unsolved'&&status(x.id)!=='Solved')||(kind==='failed'&&status(x.id)==='Failed')||(kind==='revisit'&&status(x.id)==='Revisit'));
  const el=$('#favList'); if(!el)return; el.innerHTML=a.length?a.map(qcard).join(''):'<div class=empty>No problems in this filter.</div>';
}

function bank(){
  const topics=[...new Set(DATA.master.map(x=>x.topic))].sort(),patterns=[...new Set(DATA.master.map(x=>x.pattern))].sort();
  $('#root').innerHTML=`<div class=filters><input id=fq class=input placeholder="Search problem, pattern, source…" oninput=filterBank()><select id=ft class=select onchange=filterBank()><option value="">All topics</option>${topics.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id=fp class=select onchange=filterBank()><option value="">All patterns</option>${patterns.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id=fi class=select onchange=filterBank()><option value="">Priority</option><option>P1</option><option>P2</option></select><select id=fs class=select onchange=filterBank()><option value="">Status</option><option>Not Started</option><option>Solved</option><option>Failed</option><option>Revisit</option></select></div><div id=bankList></div>`;filterBank();
}
function filterBank(){const q=($('#fq')?.value||'').toLowerCase(),t=$('#ft')?.value||'',p=$('#fp')?.value||'',i=$('#fi')?.value||'',s=$('#fs')?.value||'';const a=DATA.master.filter(x=>(!q||(x.title+' '+x.topic+' '+x.pattern+' '+x.sources).toLowerCase().includes(q))&&(!t||x.topic===t)&&(!p||x.pattern===p)&&(!i||x.importance===i)&&(!s||status(x.id)===s));$('#bankList').innerHTML=`<div class=card><div class=muted>${a.length} matches</div>${a.slice(0,300).map(qcard).join('')}</div>`}
function patterns(){$('#root').innerHTML='<div class="grid three">'+DATA.patterns.map((x,i)=>`<div class="card pattern" onclick="openPattern(${i})"><h3>${esc(x.name)}</h3><div class=badge>${esc(x.recognize)}</div><p>${esc(x.hit)}</p></div>`).join('')+'</div>'}
function focus(){const m=Math.floor(timerLeft/60),s=timerLeft%60;$('#root').innerHTML=`<div class="grid two"><div class="card timer"><div class=label>FOCUS MODE</div><div class=clock>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div><div class=actions style="justify-content:center"><button class=btn onclick=startTimer>Start</button><button class=btn onclick=pauseTimer>Pause</button><button class=btn onclick=resetTimer>Reset</button></div><p class=muted>25 minutes. No solution tab. One problem.</p></div><div class=card><h2>🎲 Random Challenge</h2><p class=muted>Pick an unsolved problem and attack it before the timer ends.</p><button class="btn primary" onclick=randomQ>Give me one →</button></div></div>`}
function startTimer(){if(timer)return;timer=setInterval(()=>{if(timerLeft>0){timerLeft--;if(timerLeft%5===0)render('focus')}else{pauseTimer();toast('⏰ Time! Log your result.')}},1000)}
function pauseTimer(){clearInterval(timer);timer=null}function resetTimer(){pauseTimer();timerLeft=1500;render('focus')}
function mistakes(){$('#root').innerHTML=`<div class=card><div class=head><h2>⚡ Mistake Lab</h2><button class="btn primary" onclick=addMistake>+ Log Mistake</button></div>${S.mistakes.length?S.mistakes.map((x,i)=>`<div class=q><div class=qm><b>${esc(x.problem)}</b><div class=badges><span class=badge>${esc(x.type)}</span><span class=badge>${esc(x.severity||'Medium')}</span></div><div class=muted>${esc(x.note||'')}</div></div><button class=btn onclick="S.mistakes.splice(${i},1);save();mistakes()">Delete</button></div>`).join(''):'<div class=empty>No mistakes logged yet. When you fail, capture why.</div>'}</div>`}
function addMistake(){const p=prompt('Problem?');if(!p)return;const t=prompt('Failure type?')||'Implementation';const n=prompt('What should you notice next time?')||'';S.mistakes.unshift({problem:p,type:t,note:n,date:new Date().toISOString()});S.xp+=15;save();toast('⚡ +15 XP');mistakes()}
function analytics(){const by={};DATA.master.forEach(x=>{by[x.topic]=by[x.topic]||{t:0,d:0};by[x.topic].t++;if(status(x.id)==='Solved')by[x.topic].d++});const sol=DATA.master.filter(x=>status(x.id)==='Solved').length;$('#root').innerHTML=`<div class="grid four"><div class=card><div class=label>Completion</div><div class=big>${Math.round(sol/DATA.master.length*100)}%</div></div><div class=card><div class=label>XP</div><div class=big>${S.xp}</div></div><div class=card><div class=label>Started</div><div class=big>${DATA.master.filter(x=>status(x.id)!=='Not Started').length}</div></div><div class=card><div class=label>Mistakes</div><div class=big>${S.mistakes.length}</div></div></div><section class=section><div class=card><h2>Topic Coverage</h2><table class=table><tr><th>Topic</th><th>Total</th><th>Solved</th><th>Progress</th></tr>${Object.entries(by).sort((a,b)=>b[1].t-a[1].t).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.t}</td><td>${v.d}</td><td><div class=progress><div class=bar style="width:${v.d/v.t*100}%"></div></div></td></tr>`).join('')}</table></div></section>`}
function settings(){$('#root').innerHTML=`<div class="grid two"><div class=card><h2>Profile</h2><div class=field><label>Display name</label><input id=displayName class=input value="${esc(S.name)}"></div><div class=field><label>Daily goal</label><select id=dailyGoal class=select>${[10,15,20,25,30].map(n=>`<option value="${n}" ${Number(S.dailyGoal)===n?'selected':''}>${n} questions/day</option>`).join('')}</select></div><button class="btn primary" onclick="S.name=$('#displayName').value||'OA Warrior';S.dailyGoal=Number($('#dailyGoal').value);save();toast('Saved')">Save</button><hr style="border-color:var(--line);margin:20px 0"><h2>Account</h2>${mode==='cloud'?`<p class=muted>Signed in as <b>${esc(user?.email||'')}</b></p><button class="btn danger" onclick=signOut>Sign out</button>`:'<p class=muted>Local demo mode.</p>'}</div><div class=card><h2>☁ Cloud Sync</h2><p class=muted>XP, solved status, notes, mistakes, goals and review state sync with your account.</p><p><span class="sync-dot ${mode==='cloud'?'ok':''}"></span>${mode==='cloud'?'Connected':'Local only'}</p><button class=btn onclick=manualSync>${mode==='cloud'?'Sync now':'Cloud sync is not connected'}</button><h3>Backup</h3><button class=btn onclick=exportProgress>Export JSON</button> <button class=btn onclick=importProgress>Import JSON</button></div></div>`}async function manualSync(){if(mode!=='cloud'){toast('Connect cloud mode first');return}await cloudSave();toast('Sync requested')}
async function signOut(){await signout()}
function oa(){const pool=DATA.master.filter(x=>status(x.id)!=='Solved');if(!S.oa)S.oa={attempts:0,solved:0,current:null};if(!S.oa.current&&pool.length)S.oa.current=pool[Math.floor(Math.random()*pool.length)].id;const x=DATA.master.find(z=>z.id===S.oa.current);$('#root').innerHTML=`<div class=card><div class=head><div><div class=label>OA SIMULATION</div><h2 style="margin:4px 0">Identify the pattern yourself.</h2></div><span class=badge>${S.oa.solved||0} solved / ${S.oa.attempts||0} attempts</span></div>${x?`<h2>${esc(x.title)}</h2><p class=muted>Topic and pattern are hidden until you open the challenge.</p><div class=actions><button class="btn primary" onclick="oaOpen()">Open Challenge</button><button class=btn onclick="oaSkip()">Skip</button></div>`:'<div class=empty>All available problems solved 🎉</div>'}</div>`}
function oaOpen(){S.oa.attempts=(S.oa.attempts||0)+1;save();openProblem(S.oa.current)}
function oaSkip(){const a=DATA.master.filter(x=>status(x.id)!=='Solved'&&x.id!==S.oa.current);S.oa.current=a.length?a[Math.floor(Math.random()*a.length)].id:null;save();oa()}
function review(){const a=DATA.master.filter(x=>status(x.id)==='Failed'||status(x.id)==='Revisit'||S.notes[x.id]);$('#root').innerHTML=`<div class=card><div class=head><div><h2 style="margin:0">Smart Review Queue</h2><div class=muted>${a.length} problems need attention.</div></div><button class="btn primary" onclick="reviewRandom()">Review one 🎯</button></div>${a.length?a.map(qcard).join(''):'<div class=empty>Nothing needs review right now. 🔥</div>'}</div>`}
function reviewRandom(){const a=DATA.master.filter(x=>status(x.id)==='Failed'||status(x.id)==='Revisit'||S.notes[x.id]);if(a.length)openProblem(a[Math.floor(Math.random()*a.length)].id);else toast('Review queue is empty 🎉')}
function openProblem(id){const x=DATA.master.find(z=>z.id===id);$('#modalBody').innerHTML=`<div class=label>${esc(x.topic)} · ${esc(x.pattern)}</div><h2>${esc(x.title)}</h2><div class=badges><span class=badge>${esc(x.sources)}</span><span class="badge ${x.importance==='P1'?'p1':''}">${x.importance}</span></div>${x.notes?`<h3>Source note</h3><p class=muted>${esc(x.notes)}</p>`:''}<p><a class="btn primary" href="${esc(x.url)}" target=_blank>Open Problem ↗</a> <button class=btn onclick="toggleFavorite('${x.id}')">${isFavorite(x.id)?'⭐ Remove Favorite':'☆ Add Favorite'}</button> <button class=btn onclick="setStatus('${x.id}','Solved');closeModal()">Solved ✓</button> <button class=btn onclick="setStatus('${x.id}','Revisit');closeModal()">Revisit</button> <button class=btn onclick="setStatus('${x.id}','Failed');closeModal()">Failed</button></p><div class=field><label>Personal note</label><textarea id=problemNote class=area>${esc(S.notes[x.id]||'')}</textarea></div><button class=btn onclick="S.notes['${x.id}']=$('#problemNote').value;save();toast('Note saved')">Save note</button>`;$('#modal').classList.add('show')}
function openPattern(i){const x=DATA.patterns[i];$('#modalBody').innerHTML=`<h2>${esc(x.name)}</h2><h3>How to recognize</h3><p class=muted>${esc(x.recognize)}</p><h3>Core idea</h3><p class=muted>${esc(x.core)}</p><h3>When to hit</h3><p class=muted>${esc(x.hit)}</p><h3>When NOT to use</h3><p class=muted>${esc(x.not)}</p><h3>Implementation traps</h3><p class=muted>${esc(x.traps)}</p>`;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function randomQ(){const a=DATA.master.filter(x=>status(x.id)!=='Solved');if(!a.length){toast('🎉 Everything solved!');return}openProblem(a[Math.floor(Math.random()*a.length)].id)}
function exportProgress(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dsa-quest-progress.json';a.click()}
function importProgress(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);localSave();save();render(page);toast('Progress imported')}catch(e){toast('Invalid JSON')}};r.readAsText(f)};inp.click()}
async function boot(){
  await connect();
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
boot();
</script>
</body></html>
